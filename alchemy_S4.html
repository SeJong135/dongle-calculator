<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연금술사 계산기</title>
  <style>
    :root{
      --panel:#1f2937;
      --line:#374151;
      --text:#e5e7eb;
      --accent:#60a5fa;
      --good:#4ade80;
      --bad:#fb7185;
      --input:#0f172a;
      --chip:#111827;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:#0f172a;color:var(--text);padding:14px;overflow-x:hidden;}
    .wrap{max-width:1600px;margin:auto}
    .card{background:var(--panel);border-radius:var(--radius);padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    
    /* 하단 결과 & 상세 카드 공통 너비 제한 */
    .bottom-card {
      max-width: 1180px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 3단 대시보드 1:1:1 레이아웃 */
    .dashboard-layout { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; margin-bottom: 14px; }
    .dash-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    
    @media (min-width: 1200px) {
      /* PC 화면: 동일한 너비 3단 */
      .dashboard-layout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
      .trade-sea-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .trade-inputs-sea { grid-template-columns: 1fr !important; }
      
      /* 하단 3x2 꽉 차게 고정 */
      .mobile-results { grid-template-columns: repeat(3, 1fr) !important; }
      .recipe-grid { grid-template-columns: repeat(3, 1fr) !important; }
    }
    @media (min-width: 850px) and (max-width: 1199px) {
      /* 태블릿/작은 모니터 */
      .dashboard-layout { display: grid; grid-template-columns: 1fr 1fr; }
      .dash-col:nth-child(3) { grid-column: 1 / -1; }
      .trade-sea-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      
      /* 하단 2x3 꽉 차게 고정 */
      .mobile-results { grid-template-columns: repeat(2, 1fr) !important; }
      .recipe-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 849px) {
      .trade-sea-grid { display: flex; flex-direction: column; gap: 10px; }
    }

    h1{margin:0;font-size:24px;color:var(--accent)}
    h2{margin:0 0 10px;font-size:18px;color:#dbeafe}
    .desc{margin-top:8px;font-size:13px;color:#cbd5e1;line-height:1.5}
    
    .grid{display:grid;gap:10px}
    .dash-col .grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dash-col .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .field label{font-size:13px;color:#bfdbfe;font-weight:700}
    
    .inline-input{display:grid;gap:6px}
    input,select,button{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px;color:white;width:100%;min-width:0;font-size:14px}
    button{cursor:pointer}
    
    /* 손익 결과 카드 */
    .mobile-results{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
    .mini-card{background:#111827;border-radius:12px;padding:12px;display:flex;flex-direction:column;}
    .mini-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .mini-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tier-badge{font-size:12px;color:#93c5fd;font-weight:600}
    .plus{color:var(--good)}
    .minus{color:var(--bad)}
    .mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1;}
    .stat{background:#1f2937;padding:6px 4px;border-radius:8px;font-size:12px;line-height:1.3;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;}
    .stat.plus{color:var(--good)}
    .stat.minus{color:var(--bad)}
    .sale-box{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:6px;align-items:center;min-width:140px}
    .sale-box input{padding:6px 8px}
    .sale-hint{font-size:11px;color:#94a3b8}
    
    textarea{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px;color:white;width:100%;min-height:90px;resize:vertical;font-family:inherit}
    .paste-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .paste-actions button{width:auto;flex:1;padding:8px 14px;border-radius:9px;font-size:13px;min-width:80px;}
    .primary-btn{background:#1d4ed8;border:1px solid #60a5fa;color:#dbeafe;font-weight:600; transition: background 0.2s;}
    .primary-btn:hover{background:#2563eb;}
    .secondary-btn{background:#374151;border:1px solid #4b5563;color:#e5e7eb;font-weight:600; transition: background 0.2s;}
    .secondary-btn:hover{background:#4b5563;}
    
    .discord-apply-notice{margin-top:10px;display:grid;gap:4px}
    .discord-apply-line{font-size:13px;line-height:1.45}
    .discord-apply-line.main{color:#bfdbfe;font-weight:700}
    .discord-apply-line.sub{color:#facc15;font-weight:600}
    .discord-apply-line.empty{color:#94a3b8;font-weight:500}
    
    /* 요약 리스트 */
    .update-summary{display:grid;gap:8px;margin-top:12px;align-items:start;width:100%;}
    .update-list{display:grid;gap:10px;justify-items:start;width:100%;}
    .update-item{background:transparent;border:none;border-radius:0;padding:0;box-shadow:none;display:flex;flex-direction:column;gap:6px;width:100%;}
    
    .update-main{
      display:grid;
      grid-template-columns: 85px 65px 70px;
      align-items:center;
      justify-content:start; 
      gap:12px;
      background:#0b1226;
      border:1px solid rgba(255,255,255,.06);
      border-radius:12px;
      padding:10px 14px;
      border-left-width:4px;
    }
    .update-item.max .update-main{border-left-color:#10b981;background:rgba(16,185,129,.1);border-top:1px solid rgba(16,185,129,.3);border-right:1px solid rgba(16,185,129,.3);border-bottom:1px solid rgba(16,185,129,.3);}
    .update-item.m1 .update-main{border-left-color:#84cc16;}
    .update-item.m2 .update-main{border-left-color:#eab308;}
    .update-item.m3 .update-main{border-left-color:#f59e0b;}
    .update-item.m4 .update-main{border-left-color:#fb7185;}
    .update-item.m5 .update-main{border-left-color:#ef4444;}
    
    .update-name{font-weight:800;color:#f8fafc;font-size:14px;line-height:1.2;white-space:nowrap;text-align:left;}
    .update-price{font-weight:800;color:#cbd5e1;font-size:14px;text-align:right;}
    .update-diff{font-weight:900;font-size:14px;text-align:center;}
    .update-diff.max{color:#34d399}
    .update-diff.minus{color:#facc15}
    
    .update-mobile-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;background:#0b1226;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px 10px;}
    .update-mobile-col{display:grid;gap:2px;text-align:center;min-width:0}
    .update-mobile-label{font-size:11px;color:#cbd5e1;font-weight:700;white-space:nowrap}
    .update-mobile-value{font-size:13px;font-weight:900;white-space:nowrap}

    /* 상세 레시피 */
    .recipe-grid{display:grid;gap:12px;margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
    .recipe{background:#111827;border-radius:10px;padding:12px}
    .recipe-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:15px;color:#dbeafe;font-weight:700}
    .recipe-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;font-size:13px;margin:4px 0;color:#d1d5db;max-width:460px}
    .recipe-total{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.12);display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;font-size:13px;font-weight:700;max-width:460px}
    .recipe-row span:last-child,.recipe-total span:last-child{text-align:right}

    .toggle-container { display:inline-flex; align-items:center; gap:8px; background:#111827; padding:6px 12px; border-radius:8px; border:1px solid var(--line); }
    .toggle-label { font-size:12px; color:#cbd5e1; font-weight:700; }
    .switch { position:relative; display:inline-block; width:36px; height:20px; margin:0; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#374151; transition:.3s; border-radius:20px; }
    .slider:before { position:absolute; content:""; height:14px; width:14px; left:3px; bottom:3px; background-color:white; transition:.3s; border-radius:50%; }
    input:checked + .slider { background-color:#34d399; }
    input:checked + .slider:before { transform:translateX(16px); }
    .toggle-row-box { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }

    .inline-detail{margin-top:10px;background:#0f172a;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;}
    .inline-detail .recipe-row{ margin:6px 0; }
    .inline-detail .recipe-total{ margin-top:8px; }
    .hidden-front{ display:none !important; }

    .unit-btn { background: #1f2937; border: 1px solid #4b5563; border-radius: 8px; color: #93c5fd; font-size: 13px; font-weight: bold; cursor: pointer; padding: 0 10px; white-space: nowrap; transition: 0.2s; user-select: none; }
    .unit-btn:hover { background: #374151; }
    .unit-btn:active { background: #4b5563; }
    .main-unit-btn { height: 100%; width: 100%; min-height: 40px; }
    
    .trade-row { background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
    .trade-checks { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
    .tier-label { background: #374151; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #dbeafe; }
    .trade-check-lbl { font-size: 13px; font-weight: bold; color: #e5e7eb; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .trade-check-lbl input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #60a5fa; margin:0;}
    .trade-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .trade-input-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .trade-input-lbl { font-size: 11px; color: #94a3b8; font-weight: bold; }
    .trade-inline { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px; }
    .trade-inline input { padding: 8px 10px; font-size: 13px; }
    .trade-row-result { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); gap:8px;}
    .trade-desc { font-size: 12px; color: #60a5fa; font-weight: 600; line-height: 1.4; word-break: keep-all; }
    .trade-subtotal { font-size: 15px; font-weight: bold; color: #4ade80; text-align: right; white-space: nowrap; }
    
    .trade-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 14px; border-top: 1px solid #374151; flex-wrap: wrap; gap: 10px; }
    .trade-total { font-size: 20px; font-weight: 900; color: #facc15; }
    .trade-footer-btns { display: flex; gap: 8px; }

    @media (max-width:780px){
      body{padding:10px}
      .recipe-head,.mini-head{flex-direction:column;align-items:flex-start;}
      .sale-box{grid-template-columns:minmax(0,1fr) 80px;width:100%}
      .trade-inputs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>연금술사 계산기</h1>
    <div class="desc">판매가는 각 룬 최대 시세, 직접 수정 가능 / Ver 1.0.5 최종 수정 : 2026-07-21</div>
  </div>

  <div class="dashboard-layout">
    
    <div class="dash-col">
      <div class="card">
        <h2>스킬 및 세팅 효과</h2>
        <div class="grid cols-3">
          <div class="field">
            <label for="bonusRate">신발 강화 (2배율)</label>
            <select id="bonusRate">
              <option value="0">노강 (0%)</option>
              <option value="0.01">+3강 (1%)</option>
              <option value="0.03">+5강 (3%)</option>
              <option value="0.05">+7강 (5%)</option>
              <option value="0.06">+10강 (6%)</option>
              <option value="0.08">+13강 (8%)</option>
              <option value="0.10">+15강 (10%)</option>
              <option value="0.15">+17강 (15%)</option>
              <option value="0.20">+20강 (20%)</option>
            </select>
          </div>
          <div class="field">
            <label for="petBonus">연금 펫 (반환율)</label>
            <select id="petBonus">
              <option value="0">펫 없음 (0%)</option>
              <option value="0.01">0레벨 (1%)</option>
              <option value="0.02">1레벨 (2%)</option>
              <option value="0.03">2레벨 (3%)</option>
              <option value="0.04">3레벨 (4%)</option>
              <option value="0.045">4레벨 (4.5%)</option>
              <option value="0.05">5레벨 (5%)</option>
            </select>
          </div>
          <div class="field">
            <label for="skillLevel">추출 강화 스킬 레벨</label>
            <input id="skillLevel" type="number" placeholder="0" value="0">
          </div>
        </div>
        
        <div class="toggle-row-box">
          <div class="toggle-container">
            <span class="toggle-label">기분 50 이상 (+10%)</span>
            <label class="switch"><input type="checkbox" class="toggle-mood" onchange="syncMood(this.checked)"><span class="slider"></span></label>
          </div>
          <div class="toggle-container">
            <span class="toggle-label">행운 룬 사용 (+35%)</span>
            <label class="switch"><input type="checkbox" class="toggle-fortune" onchange="syncFortune(this.checked)"><span class="slider"></span></label>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>재료 시세</h2>
        <div class="grid cols-4" id="priceGrid"></div>
      </div>
    </div>
    
    <div class="dash-col">
      <div class="card" style="height:100%;">
        <h2>디코 변동가 입력</h2>
        <textarea id="discordPaste" placeholder="[화염저항] | 199 → 260"></textarea>
        <div class="paste-actions">
          <button id="applyDiscordBtn" class="primary-btn">변경가 적용</button>
          <button id="resetDiscordBtn" class="secondary-btn">초기화</button>
          <button id="maxDiscordBtn" class="secondary-btn">최대치 입력</button>
        </div>
        
        <div style="margin-top:20px; border-top:1px solid #374151; padding-top:14px;">
          <h2 style="font-size:15px; color:#cbd5e1;">시세 반영 요약 리스트</h2>
          <div id="discordApplyNotice" class="discord-apply-notice" style="margin-top:0; margin-bottom:8px;"></div>
          <div id="updateSummary" class="update-summary" style="margin-top:0;"></div>
        </div>
      </div>
    </div>
    
    <div class="dash-col">
      <div class="card" style="display:flex; flex-direction:column;">
        <h2 style="margin-bottom:12px;">해산물 계산기</h2>
        <div id="tradeRowsSea" class="trade-sea-grid">
          </div>
        <div class="trade-footer">
          <div class="trade-total" id="trade_sea_total">0 냥</div>
          <div class="trade-footer-btns">
            <button class="secondary-btn" style="padding:6px 14px; font-size:12px;" onclick="copyTradeTotal('sea')">금액 복사</button>
            <button class="primary-btn" style="padding:6px 14px; font-size:12px;" onclick="syncTradeToMain('sea')">시세 반영</button>
          </div>
        </div>
      </div>

      <div class="card" style="display:flex; flex-direction:column;">
        <h2 style="margin-bottom:12px;">보석 계산기</h2>
        <div>
          <div class="trade-row">
            <div class="trade-checks">
              <span class="tier-label" style="background:#4b5563;"></span>
              <span style="font-size:13px; font-weight:bold; color:#e5e7eb; padding-left:2px;">보석</span>
            </div>
            <div class="trade-inputs">
              <div class="trade-input-group">
                <span class="trade-input-lbl">가격 단위 & 금액</span>
                <div class="trade-inline">
                  <button type="button" class="unit-btn" id="trade_g_pu" data-u="stack" onclick="cycleTradeUnit(this, 'gem_p')">1세트당</button>
                  <input type="number" id="trade_g_pv" oninput="calcTrade()" placeholder="금액">
                </div>
              </div>
              <div class="trade-input-group">
                <span class="trade-input-lbl">수량 단위 & 갯수</span>
                <div class="trade-inline">
                  <button type="button" class="unit-btn" id="trade_g_qu" data-u="stack" onclick="cycleTradeUnit(this, 'gem_q')">세트</button>
                  <input type="number" id="trade_g_qv" oninput="calcTrade()" placeholder="수량">
                </div>
              </div>
            </div>
            <div class="trade-row-result">
              <div class="trade-desc" id="trade_g_desc"></div>
              <div class="trade-subtotal" id="trade_g_total" style="color:#60a5fa;">0 냥</div>
            </div>
          </div>
        </div>
        <div class="trade-footer">
          <div class="trade-total" id="trade_gem_total">0 냥</div>
          <div class="trade-footer-btns">
            <button class="secondary-btn" style="padding:6px 14px; font-size:12px;" onclick="copyTradeTotal('gem')">금액 복사</button>
            <button class="primary-btn" style="padding:6px 14px; font-size:12px;" onclick="syncTradeToMain('gem')">시세 반영</button>
          </div>
        </div>
      </div>
    </div>
    
  </div> <div class="card bottom-card">
    <h2>손익 결과</h2>
    <div id="mobileResults" class="mobile-results"></div>
  </div>

  <div class="card bottom-card hidden-front" id="detailRecipeSection" style="margin-top:14px;">
    <h2>상세 레시피</h2>
    <div id="recipeGrid" class="recipe-grid"></div>
  </div>
</div>

<script>
var STACK = 64;
var SHULKER = 1728;
var STORAGE_KEY = 'alchemist_calc_v24_final';
var DISCORD_TEXT_KEY = 'alchemist_discord_text_v24';
var DISCORD_UPDATES_KEY = 'alchemist_discord_updates_v24';
var openedDetailKeys = {};
var saleState = {};
var moodChecked = false;
var fortuneChecked = false;

window.tradeTotals = { sea: 0, gem: 0 };
  
var UNIT_CYCLE = {
  main_other:   [{u:'item', l:'1개'}, {u:'stack', l:'1세트'}, {u:'shulker', l:'1셜커'}],
  main_boxable: [{u:'item', l:'1개'}, {u:'stack', l:'1세트'}, {u:'box', l:'1상자'}, {u:'shulker', l:'1셜커'}],
  sea_p:        [{u:'stack', l:'1세트당'}, {u:'box', l:'상자당'}, {u:'shulker', l:'셜커당'}, {u:'item', l:'1개당'}],
  sea_q:        [{u:'stack', l:'세트'}, {u:'box', l:'상자'}, {u:'shulker', l:'셜커'}],
  gem_p:        [{u:'stack', l:'1세트당'}, {u:'shulker', l:'셜커당'}, {u:'item', l:'1개당'}],
  gem_q:        [{u:'stack', l:'세트'}, {u:'shulker', l:'셜커'}]
};

var PRICE_FIELDS = [
  {id:'price_wart', label:'네더와트', cycle: 'main_boxable'},
  {id:'price_blaze', label:'발광석(블레이즈 막대)', cycle: 'main_other'},
  {id:'price_gem', label:'보석(5종)', cycle: 'main_other'},
  {id:'price_gul_sora', label:'굴 & 소라', cycle: 'main_boxable'},
  {id:'price_miyeok_kijo', label:'미역 & 키조개', cycle: 'main_boxable'},
  {id:'price_jeonbok_meongge', label:'전복 & 멍게', cycle: 'main_boxable'},
  {id:'price_honghap_haesam', label:'홍합 & 해삼', cycle: 'main_boxable'}
];

var INPUT_IDS = ['bonusRate','petBonus','skillLevel'];

var RECIPES = [
  {key:'eogyeol', tier:'', name:'어결', max:5, detail:[
    ['물병 1개', function(p){return 1;}],
    ['네더와트 1/3개', function(p){return p.wart/3;}],
    ['양조 1/3회분 (발광석)', function(p){return (p.blaze/40)/3;}]
  ]},
  {key:'fire', tier:'1차', name:'화염저항', max:270, detail:[

function formatSetsStr(totalSets) {
  var boxes = Math.floor(totalSets / 9);
  var rem = Math.round((totalSets % 9) * 100) / 100;
  var parts = [];
  if(boxes > 0) parts.push(boxes + '상자 세트');
  if(rem > 0) parts.push(rem + '세트');
  if(boxes === 0 && rem === 0) parts.push('0세트');
  return parts.join(' ');
}

function parseTradePrice(rawStr, unit, isGem) {
  var val = parseFloat(rawStr);
  if(isNaN(val)) return 0;
  if(val < 100) {
    if(!isGem && unit === 'item') return val;
    return val * 10000;
  }
  return val;
}

function calcTrade() {
  var totalSea = 0;
  for(var i=1; i<=4; i++) {
    var pv = document.getElementById('trade_t'+i+'_pv').value;
    var pu = document.getElementById('trade_t'+i+'_pu').getAttribute('data-u');
    var qv = document.getElementById('trade_t'+i+'_qv').value;
    var qu = document.getElementById('trade_t'+i+'_qu').getAttribute('data-u');
    var c1El = document.getElementById('trade_t'+i+'_c1');
    var c2El = document.getElementById('trade_t'+i+'_c2');
    
    var n1 = c1El.nextSibling.nodeValue.trim();
    var n2 = c2El.nextSibling.nodeValue.trim();
    var chk1 = c1El.checked;
    var chk2 = c2El.checked;
    
    var parsedPrice = parseTradePrice(pv, pu, false);
    var qty = parseFloat(qv) || 0;
    
    if(parsedPrice > 0 && qty > 0 && (chk1 || chk2)) {
      var pricePerSet = 0;
      if(pu === 'item') pricePerSet = parsedPrice * 64;
      else if(pu === 'stack') pricePerSet = parsedPrice;
      else if(pu === 'box') pricePerSet = parsedPrice / 9;
      else if(pu === 'shulker') pricePerSet = parsedPrice / 27;

      var qtyInSets = 0;
      if(qu === 'stack') qtyInSets = qty;
      else if(qu === 'box') qtyInSets = qty * 9;
      else if(qu === 'shulker') qtyInSets = qty * 27;

      var itemsCount = (chk1 ? 1 : 0) + (chk2 ? 1 : 0);
      var subtotal = pricePerSet * qtyInSets * itemsCount;
      totalSea += subtotal;

      document.getElementById('trade_t'+i+'_total').innerText = fmt0(subtotal) + ' 냥';
      
      var strStr = formatSetsStr(qtyInSets);
      var dArr = [];
      if(chk1) dArr.push(n1 + ' ' + strStr);
      if(chk2) dArr.push(n2 + ' ' + strStr);
      
      var descHtml = dArr.join(' <span style="color:#cbd5e1; font-weight:normal;">+</span> ');
      if(itemsCount === 2) descHtml += ' <br><span style="color:#94a3b8; font-size:11px;">(총 ' + formatSetsStr(qtyInSets * 2) + ')</span>';
      
      document.getElementById('trade_t'+i+'_desc').innerHTML = descHtml;
    } else {
      document.getElementById('trade_t'+i+'_total').innerText = '0 냥';
      document.getElementById('trade_t'+i+'_desc').innerHTML = '';
    }
  }
  window.tradeTotals.sea = totalSea;
  document.getElementById('trade_sea_total').innerText = fmt0(totalSea) + ' 냥';

  // Gem calc
  var g_pv = document.getElementById('trade_g_pv').value;
  var g_pu = document.getElementById('trade_g_pu').getAttribute('data-u');
  var g_qv = document.getElementById('trade_g_qv').value;
  var g_qu = document.getElementById('trade_g_qu').getAttribute('data-u');

  var parsedGemPrice = parseTradePrice(g_pv, g_pu, true);
  var g_qty = parseFloat(g_qv) || 0;
  var totalGem = 0;

  if(parsedGemPrice > 0 && g_qty > 0) {
    var gPricePerSet = 0;
    if(g_pu === 'item') gPricePerSet = parsedGemPrice * 64;
    else if(g_pu === 'stack') gPricePerSet = parsedGemPrice;
    else if(g_pu === 'shulker') gPricePerSet = parsedGemPrice / 27;

    var gQtyInSets = 0;
    if(g_qu === 'stack') gQtyInSets = g_qty;
    else if(g_qu === 'shulker') gQtyInSets = g_qty * 27;

    totalGem = gPricePerSet * gQtyInSets;
    document.getElementById('trade_g_total').innerText = fmt0(totalGem) + ' 냥';
    
    var g_qu_lbl = (g_qu === 'stack') ? '세트' : '셜커';
    document.getElementById('trade_g_desc').innerHTML = '보석 ' + g_qty + g_qu_lbl;
  } else {
    document.getElementById('trade_g_total').innerText = '0 냥';
    document.getElementById('trade_g_desc').innerHTML = '';
  }
  window.tradeTotals.gem = totalGem;
  document.getElementById('trade_gem_total').innerText = fmt0(totalGem) + ' 냥';
}

function unitSize(unit){

  if(unit==='box') return STACK * 9;
  if(unit==='shulker') return SHULKER;
  return 1;
}
function num(v){ var n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function fmt1(v){ return num(v).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmt0(v){ return Math.round(num(v)).toLocaleString('ko-KR'); }
function fmtRatio(v){ return (num(v)*100).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
function shulkerValue(v){ return num(v) * SHULKER; }

function perUnit(id){

function normalizeName(name){
  return String(name || '').replace(/[🧪룬\[\]｜|ㅣl]/g, '').replace(/\([^)]*\)/g, ' ').replace(/\d+(?:\.\d+)?\s*원?/g, ' ').replace(/[→>\-]+/g, ' ').replace(/\s+/g,'').trim();
}

function resolveRecipeByName(rawName){
  var normalized = normalizeName(rawName);
  if(!normalized) return null;
  if(normalized === '어색한결정' || normalized === '어결') {
    for(var i=0; i<RECIPES.length; i++){ if(RECIPES[i].key === 'eogyeol') return RECIPES[i]; }
  }
  for(var i=0; i<RECIPES.length; i++){ if(normalizeName(RECIPES[i].name) === normalized) return RECIPES[i]; }
  for(var j=0; j<RECIPES.length; j++){ if(normalizeName(RECIPES[j].name).indexOf(normalized) !== -1 || normalized.indexOf(normalizeName(RECIPES[j].name)) !== -1) return RECIPES[j]; }
  return null;
}

function parseDiscordUpdates(text){
  var lines = String(text || '').split(/\n+/);
  var updates = [];
  for(var i=0; i<lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;
    var rawName = '', newValue = null;
    var arrowMatch = line.match(/(?:🧪\s*)?(?:\[(.+?)\]|([^|]+?))\s*[\|ㅣ]?\s*(-?\d+(?:\.\d+)?)\s*[→>\-]+\s*(-?\d+(?:\.\d+)?)/);
    if(arrowMatch){
      rawName = (arrowMatch[1] || arrowMatch[2] || '').trim();
      newValue = num(arrowMatch[4]);
    } else {
      var simpleMatch = line.match(/(?:🧪\s*)?(?:\[(.+?)\]|([^|]+?))\s*[\|ㅣ]?\s*(-?\d+(?:\.\d+)?)(?:\s*원)?$/);
      if(!simpleMatch) continue;
      rawName = (simpleMatch[1] || simpleMatch[2] || '').trim();
      newValue = num(simpleMatch[3]);
    }
    var recipe = resolveRecipeByName(rawName);
    if(!recipe || !Number.isFinite(newValue) || recipe.key === 'eogyeol') continue;
    updates.push({key: recipe.key, name: recipe.name, rawName: rawName, newValue: newValue, max: recipe.max, diffFromMax: newValue - recipe.max});
  }
  var deduped = [], seen = {};
  for(var k=updates.length-1; k>=0; k--){
    var item = updates[k];
    if(!seen[item.key]){ seen[item.key] = true; deduped.push(item); }
  }
  return deduped.reverse();
}

  } else {

    for(var i=0; i<safeUpdates.length; i++) updatedKeys[safeUpdates[i].key] = true;

      if(RECIPES[j].key === 'eogyeol') continue;

    }

    else missingLine = '(' + missingNames.join(', ') + ' 빠짐 - 최고가 유지)';
  }

  var html = '';
  if(appliedLine) html += '<div class="discord-apply-line main">' + appliedLine + '</div>';
  var subClass = appliedLine ? 'sub' : 'empty';
  html += '<div class="discord-apply-line ' + subClass + '">' + missingLine + '</div>';
  box.innerHTML = html;
}

function renderUpdateSummary(){
  var box = document.getElementById('updateSummary');
  if(!box) return;

  var dataArr = buildAllData();
  var updates = getStoredDiscordUpdates();
  var visible = [];

  if(updates.length === 0) {
    for(var i=0; i<dataArr.length; i++) {
      var res = dataArr[i];
      if(res.key === 'eogyeol') continue;
      visible.push({ key: res.key, name: res.name, newValue: res.max, diffFromMax: 0, bucket: 'max', result: res });
    }
  } else {
    var resultMap = {};
    for(var i=0; i<dataArr.length; i++) resultMap[dataArr[i].key] = dataArr[i];

    for(var j=0; j<updates.length; j++){
      var u = updates[j];
      var bucket = u.diffFromMax >= 0 ? 'max' : Math.abs(Math.round(u.diffFromMax));
      visible.push({key: u.key, name: u.name, newValue: u.newValue, diffFromMax: u.diffFromMax, bucket: bucket, result: resultMap[u.key]});
    }
    visible.sort(function(a, b) {
      var idxA = -1, idxB = -1;
      for(var k=0; k<RECIPES.length; k++) {
        if(RECIPES[k].key === a.key) idxA = k;
        if(RECIPES[k].key === b.key) idxB = k;
      }
      return idxA - idxB;
    });
  }

  if(visible.length === 0){ box.innerHTML = ''; return; }

  var html = '<div class="update-list">';
  
  for(var m=0; m<visible.length; m++){
    var item = visible[m];
    var res = item.result;
    var totalProfitText = res ? (res.profit >= 0 ? '+' : '') + fmt1(res.profit) : '-';
    var shulkerProfitText = res ? (res.profit >= 0 ? '+' : '') + fmt0(shulkerValue(res.profit)) : '-';
    var roiText = res ? (res.roi >= 0 ? '+' : '') + fmtRatio(res.roi) : '-';
    
    var shulkerDiff = res ? shulkerValue(item.newValue - res.max) : 0;
    var shulkerDiffText = shulkerDiff < 0 ? fmt0(shulkerDiff) + '원' : '-';
    
    var diffClass = item.bucket === 'max' ? 'max' : 'minus';
    var rowClass = item.bucket === 'max' ? 'max' : 'm' + item.bucket;
    var diffText = item.bucket === 'max' ? '최고가' : '(-' + item.bucket + ')';
    var plusClass = res && res.profit >= 0 ? 'plus' : 'minus';
    var rClass = res && res.roi >= 0 ? 'plus' : 'minus';

    html += '<div class="update-item ' + rowClass + '"><div class="update-main"><span class="update-name">[' + item.name + ']</span><span class="update-price">' + fmt0(item.newValue) + '원</span><span class="update-diff ' + diffClass + '">' + diffText + '</span></div>';
    
    html += '<div class="update-mobile-stats"><div class="update-mobile-col"><span class="update-mobile-label">손익</span><span class="update-mobile-value ' + plusClass + '">' + totalProfitText + '</span></div><div class="update-mobile-col"><span class="update-mobile-label">1셜커 이익</span><span class="update-mobile-value ' + plusClass + '">' + shulkerProfitText + '</span></div><div class="update-mobile-col"><span class="update-mobile-label">이율</span><span class="update-mobile-value ' + rClass + '">' + roiText + '</span></div><div class="update-mobile-col"><span class="update-mobile-label">최고가 차액</span><span class="update-mobile-value ' + (shulkerDiff < 0 ? 'minus' : '') + '">' + shulkerDiffText + '</span></div></div></div>';
  }
  html += '</div>';
  box.innerHTML = html;
}

function applyDiscordTextToSales(text){
  var updates = parseDiscordUpdates(text);
  var saleMap = {};
  RECIPES.forEach(function(r) { saleMap[r.key] = r.max; });
  updates.forEach(function(u) { saleMap[u.key] = u.newValue; });
  saleState = Object.assign({}, saleState, saleMap);

  var textarea = document.getElementById('discordPaste');
  if(textarea) textarea.value = text;
  try {
    localStorage.setItem(DISCORD_TEXT_KEY, text || '');
    localStorage.setItem(DISCORD_UPDATES_KEY, JSON.stringify(updates));
  } catch(e){}
  
  render();
  renderDiscordApplyNotice(updates);
}

function resetDiscordPricing(){
  var textarea = document.getElementById('discordPaste');
  if(textarea) textarea.value = '';
  try {
    localStorage.removeItem(DISCORD_TEXT_KEY);
    localStorage.removeItem(DISCORD_UPDATES_KEY);
  } catch(e){}
  
  saleState = {};
  RECIPES.forEach(function(r) { saleState[r.key] = r.max; });
  render();
  renderDiscordApplyNotice([]);
}

function buildAllData(){
  var p = getPrices();
  var bonusEl = document.getElementById('bonusRate');
  var shoeBonus = bonusEl ? num(bonusEl.value) : 0;
  var petEl = document.getElementById('petBonus');
  var pet = petEl ? num(petEl.value) : 0;
  
  var petDiscountFactor = 1 - (pet * 0.5 * 0.33);

  return RECIPES.map(function(r) {
    var detail = r.detail.map(function(item) { return [item[0], item[1](p)]; });
    var raw = 0;
    for(var i=0; i<detail.length; i++) raw += detail[i][1];
    
    var cost = 0;
    if(r.key === 'eogyeol') {
        cost = raw * (3 / p.expectedYield);
    } else {
        cost = (raw * petDiscountFactor) / (1 + shoeBonus);
    }

    var saleVal = saleState[r.key];
    var sale = (r.key === 'eogyeol') ? 5 : (saleVal !== undefined ? num(saleVal) : r.max);
    var profit = sale - cost;
    var roi = cost > 0 ? (profit / cost) : (sale > 0 ? 1 : 0);
    
    return {key: r.key, tier: r.tier, name: r.name, max: r.max, detail: detail, raw: raw, cost: cost, sale: sale, profit: profit, roi: roi};
  });
}

function attachSaleEvents(){
  RECIPES.forEach(function(r) {
    if(r.key === 'eogyeol') return;
    var el = document.getElementById(saleInputId(r.key));
    if(!el || el.getAttribute('data-bound')) return;
    el.setAttribute('data-bound', '1');

    el.addEventListener('input', function() { saleState[r.key] = num(el.value); saveState(); renderUpdateSummary(); });
    el.addEventListener('blur', function() { saleState[r.key] = num(el.value); saveState(); render(); });
    el.addEventListener('keydown', function(e) { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  });
}

function attachDetailEvents(){
  var btns = document.querySelectorAll('[data-detail-key]');
  for(var i=0; i<btns.length; i++){
    var btn = btns[i];
    if(btn.getAttribute('data-bound')) continue;
    btn.setAttribute('data-bound', '1');
    btn.addEventListener('click', function(e) {
      var key = e.target.getAttribute('data-detail-key');
      if(openedDetailKeys[key]) delete openedDetailKeys[key];
      else openedDetailKeys[key] = true;
      render();
    });
  }
}

function render(){
  var data = buildAllData();
  var p = getPrices();

  var mobileHtml = data.map(function(r) {
    var tierBadge = r.tier ? '<span class="tier-badge">· ' + r.tier + '</span>' : '';
    var pClass = r.profit >= 0 ? 'plus' : 'minus';
    var rClass = r.roi >= 0 ? 'plus' : 'minus';
    var pSign = r.profit >= 0 ? '+' : '';
    var rSign = r.roi >= 0 ? '+' : '';
    
    var html = '<div class="mini-card"><div class="mini-head"><div><div class="mini-title">' + r.name + ' ' + tierBadge + '</div></div>';
    
    if(r.key === 'eogyeol'){
      html += '<div class="sale-box"><input type="number" value="5" disabled><div class="sale-hint">고정가</div></div></div>';
    } else {
      html += '<div class="sale-box"><input id="' + saleInputId(r.key) + '" type="number" step="1" inputmode="numeric" value="' + r.sale + '"><div class="sale-hint">판매가</div></div></div>';
    }

    html += '<div class="mini-grid"><div class="stat"><span>원가</span><span style="font-weight:bold;">' + fmt1(r.cost) + '</span></div><div class="stat"><span>1셜커<br>판매가</span><span style="font-weight:bold;">' + fmt0(shulkerValue(r.sale)) + '</span></div>';
    html += '<div class="stat ' + pClass + '"><span>손익</span><span style="font-weight:bold;">' + pSign + fmt1(r.profit) + '</span></div><div class="stat ' + rClass + '"><span>이율</span><span style="font-weight:bold;">' + rSign + fmtRatio(r.roi) + '</span></div>';
    
    var shulkerDiff = shulkerValue(r.sale - r.max);
    var shulkerDiffSpan = (r.key !== 'eogyeol' && shulkerDiff < 0) ? ' <span style="color:var(--bad); font-weight:500;">(최고가 차액 ' + fmt0(shulkerDiff) + '원)</span>' : '';

    html += '<div class="stat ' + pClass + '" style="grid-column: span 4; font-weight: bold; background: #1e293b; flex-direction:row;">1셜커 이익: ' + pSign + fmt0(shulkerValue(r.profit)) + '원' + shulkerDiffSpan + '</div>';
    
    if(r.key === 'eogyeol'){
      var brews = 1728 / 3;
      var yPotions = brews * p.expectedYield;
      var sProfit = (yPotions * r.sale) - (1728 * r.raw);
      var sClass = sProfit >= 0 ? 'plus' : 'minus';
      var sSign = sProfit >= 0 ? '+' : '';
      html += '<div class="stat ' + sClass + '" style="grid-column: span 4; font-weight: bold; background: rgba(52, 211, 153, 0.1); color: #34d399; flex-direction:row; margin-top:2px;">물병 1셜커 수익: ' + sSign + fmt0(sProfit) + '원</div>';
    }
    
    html += '</div>';
    
    html += '<div class="inline-detail">';
    for(var j=0; j<r.detail.length; j++){
      html += '<div class="recipe-row"><span>' + r.detail[j][0] + '</span><span>' + fmt1(r.detail[j][1]) + '</span></div>';
    }
    if(r.key === 'eogyeol'){
      html += '<div class="toggle-row-box" style="border-top:1px dashed var(--line); padding-top:6px; margin-top:6px;"><div class="toggle-container"><span class="toggle-label">기분 50 이상 (+10%)</span><label class="switch"><input type="checkbox" class="toggle-mood" ' + (moodChecked?'checked':'') + ' onchange="syncMood(this.checked)"><span class="slider"></span></label></div><div class="toggle-container"><span class="toggle-label">행운 룬 사용 (+35%)</span><label class="switch"><input type="checkbox" class="toggle-fortune" ' + (fortuneChecked?'checked':'') + ' onchange="syncFortune(this.checked)"><span class="slider"></span></label></div></div>';
    }
    if(Math.abs(r.cost - r.raw) > 0.000001 && r.key !== 'eogyeol') {
        html += '<div class="recipe-total"><span>원재료 합</span><span>' + fmt1(r.raw) + '</span></div>';
    }
    html += '<div class="recipe-total"><span>최종 원가</span><span>' + fmt1(r.cost) + '</span></div></div>';
    
    html += '</div>';
    return html;
  }).join('');

  var gridHtml = data.map(function(r) {
    var tierBadge = r.tier ? '<span class="tier-badge">' + r.tier + '</span>' : '';
    var pClass = r.profit >= 0 ? 'plus' : 'minus';
    var pSign = r.profit >= 0 ? '+' : '';
    
    var html = '<div class="recipe"><div class="recipe-head"><span>' + r.name + ' ' + tierBadge + '</span><span class="' + pClass + '">손익 ' + pSign + fmt1(r.profit) + '</span></div>';
    for(var j=0; j<r.detail.length; j++){
      html += '<div class="recipe-row"><span>' + r.detail[j][0] + '</span><span>' + fmt1(r.detail[j][1]) + '</span></div>';
    }
    if(r.key === 'eogyeol'){
        html += '<div class="toggle-row-box" style="border-top:1px dashed var(--line); padding-top:6px; margin-top:6px;"><div class="toggle-container"><span class="toggle-label">기분 50 이상 (+10%)</span><label class="switch"><input type="checkbox" class="toggle-mood" ' + (moodChecked?'checked':'') + ' onchange="syncMood(this.checked)"><span class="slider"></span></label></div><div class="toggle-container"><span class="toggle-label">행운 룬 사용 (+35%)</span><label class="switch"><input type="checkbox" class="toggle-fortune" ' + (fortuneChecked?'checked':'') + ' onchange="syncFortune(this.checked)"><span class="slider"></span></label></div></div>';
    }
    if(Math.abs(r.cost - r.raw) > 0.000001 && r.key !== 'eogyeol') {
        html += '<div class="recipe-total"><span>원재료 합</span><span>' + fmt1(r.raw) + '</span></div>';
    }
    html += '<div class="recipe-total"><span>최종 원가</span><span>' + fmt1(r.cost) + '</span></div></div>';
    return html;
  }).join('');

  document.getElementById('mobileResults').innerHTML = mobileHtml;
  document.getElementById('recipeGrid').innerHTML = gridHtml;

  attachSaleEvents();
  attachDetailEvents();
  renderUpdateSummary();
  updateTogglesDOM();
  saveState();
}

function saveState(){
  try {
    var state = { openedDetailKeys: openedDetailKeys, moodChecked: moodChecked, fortuneChecked: fortuneChecked };
    var bonus = document.getElementById('bonusRate');
    var pet = document.getElementById('petBonus');
    var skill = document.getElementById('skillLevel');
    if(bonus) state.bonusRate = bonus.value;
    if(pet) state.petBonus = pet.value;
    if(skill) state.skillLevel = skill.value;
    
    PRICE_FIELDS.forEach(function(f) {
      var v = document.getElementById(f.id + '_value');
      var u = document.getElementById(f.id + '_unit');
      if(v) state[f.id + '_value'] = v.value;
      if(u) state[f.id + '_unit'] = u.value;
    });
    RECIPES.forEach(function(r) {
      if(r.key !== 'eogyeol'){
        state[saleInputId(r.key)] = saleState[r.key] !== undefined ? saleState[r.key] : r.max;
      }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  try{
    var state = JSON.parse(raw);
    if(state.bonusRate !== undefined && document.getElementById('bonusRate')) document.getElementById('bonusRate').value = state.bonusRate;
    if(state.petBonus !== undefined && document.getElementById('petBonus')) document.getElementById('petBonus').value = state.petBonus;
    if(state.skillLevel !== undefined && document.getElementById('skillLevel')) document.getElementById('skillLevel').value = state.skillLevel;
    if(state.openedDetailKeys !== undefined) openedDetailKeys = state.openedDetailKeys;
    if(state.moodChecked !== undefined) moodChecked = state.moodChecked;
    if(state.fortuneChecked !== undefined) fortuneChecked = state.fortuneChecked;
    
    PRICE_FIELDS.forEach(function(f) {
      var v = document.getElementById(f.id + '_value');
      var u = document.getElementById(f.id + '_unit');
      var u_btn = document.getElementById(f.id + '_unit_btn');
      
      if(v && state[f.id + '_value'] !== undefined) v.value = state[f.id + '_value'];
      if(u && state[f.id + '_unit'] !== undefined) {
        u.value = state[f.id + '_unit'];
        var cycleType = f.cycle;
        var match = UNIT_CYCLE[cycleType].find(function(x){ return x.u === u.value; });
        if(match && u_btn) {
          u_btn.setAttribute('data-u', match.u);
          u_btn.innerText = match.l;
        }
      }
    });
    window.__saleState = state;
  }catch(e){ window.__saleState = {}; }
}

function hydrateSaleDefaults(){
  saleState = {};
  RECIPES.forEach(function(r) {
    var saved = undefined;
    if(window.__saleState && window.__saleState[saleInputId(r.key)] !== undefined) {
        saved = window.__saleState[saleInputId(r.key)];
    }
    saleState[r.key] = saved !== undefined ? num(saved) : r.max;
  });
}

document.addEventListener('DOMContentLoaded', function() {
  buildPriceGrid();
  buildTradeSeaGrid();
  loadState();
  updateTogglesDOM();
  
  var bonusRateEl = document.getElementById('bonusRate');
  var petBonusEl = document.getElementById('petBonus');
  var skillLevelEl = document.getElementById('skillLevel');
  
  if(bonusRateEl) {
    bonusRateEl.addEventListener('input', render);
    bonusRateEl.addEventListener('change', render);
  }
  if(petBonusEl) petBonusEl.addEventListener('change', render);
  if(skillLevelEl) skillLevelEl.addEventListener('input', render);
  
  PRICE_FIELDS.forEach(function(f) {
    var v = document.getElementById(f.id + '_value');
    if(v) v.addEventListener('input', render);
  });
  
  var discordPasteEl = document.getElementById('discordPaste');
  if(discordPasteEl){
    discordPasteEl.addEventListener('input', function() {
      var text = discordPasteEl.value;
      var normalized = text.replace(/:test_tube:/g, '🧪');
      if(normalized !== text){
        var start = discordPasteEl.selectionStart;
        var end = discordPasteEl.selectionEnd;
        discordPasteEl.value = normalized;
        try{ discordPasteEl.setSelectionRange(start, end); }catch(e){}
      }
    });
    
    discordPasteEl.addEventListener('paste', function() {
      requestAnimationFrame(function() {
        var text = discordPasteEl.value;
        var normalized = text.replace(/:test_tube:/g, '🧪');
        if(normalized !== text) discordPasteEl.value = normalized;
      });
    });
  }
  
  var applyBtn = document.getElementById('applyDiscordBtn');
  if(applyBtn) applyBtn.addEventListener('click', function() { applyDiscordTextToSales(document.getElementById('discordPaste').value); });
  
  var resetBtn = document.getElementById('resetDiscordBtn');
  if(resetBtn) resetBtn.addEventListener('click', resetDiscordPricing);
  
  var maxBtn = document.getElementById('maxDiscordBtn');
  if(maxBtn) {
    maxBtn.addEventListener('click', function() {
      var text = RECIPES.map(function(r) {
        if(r.key === 'eogyeol') return '';
        return '[' + r.name + '] | ' + r.max;
      }).filter(Boolean).join('\n');
      var textarea = document.getElementById('discordPaste');
      if(textarea) textarea.value = text;
      applyDiscordTextToSales(text);
    });
  }
  
  hydrateSaleDefaults();
  
  try {
    var savedDiscordText = localStorage.getItem(DISCORD_TEXT_KEY);
    if(savedDiscordText){
      var textarea = document.getElementById('discordPaste');
      if(textarea) textarea.value = savedDiscordText;
      applyDiscordTextToSales(savedDiscordText);
    }
  } catch(e) {}
  
  render();
});
</script>
